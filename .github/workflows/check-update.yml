name: Auto-update devo-bin

on:
  schedule:
    # Daily at 8:23 UTC
    - cron: '23 8 * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Check for upstream update
        id: check
        run: |
          LATEST=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/7df-lab/devo/releases/latest | jq -r .tag_name)

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Failed to fetch latest release from 7df-lab/devo"
            exit 1
          fi

          LATEST_VER="${LATEST#v}"
          CURRENT_VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)

          echo "latest=${LATEST_VER}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT_VER}" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_VER" != "$CURRENT_VER" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version found: v${LATEST_VER} (current: v${CURRENT_VER})"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Already at latest version: v${CURRENT_VER}"
          fi

      - name: Download tarballs and compute checksums
        if: steps.check.outputs.update == 'true'
        id: update
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          CURRENT="${{ steps.check.outputs.current }}"

          # Download both architecture tarballs
          echo "::group::Downloading release tarballs"
          curl -sSL --fail -o /tmp/devo-x86_64.tar.gz \
            "https://github.com/7df-lab/devo/releases/download/v${VERSION}/devo-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL --fail -o /tmp/devo-aarch64.tar.gz \
            "https://github.com/7df-lab/devo/releases/download/v${VERSION}/devo-v${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          echo "::endgroup::"

          # Compute sha256sums
          SHA_X86=$(sha256sum /tmp/devo-x86_64.tar.gz | cut -d' ' -f1)
          SHA_AARCH64=$(sha256sum /tmp/devo-aarch64.tar.gz | cut -d' ' -f1)

          echo "sha_x86=${SHA_X86}" >> "$GITHUB_OUTPUT"
          echo "sha_aarch64=${SHA_AARCH64}" >> "$GITHUB_OUTPUT"

          echo "::notice::x86_64  sha256: ${SHA_X86}"
          echo "::notice::aarch64 sha256: ${SHA_AARCH64}"

          # Generate updated PKGBUILD
          sed "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD > /tmp/PKGBUILD.new
          sed -i "s|v${CURRENT}|v${VERSION}|g" /tmp/PKGBUILD.new
          sed -i "s|devo-bin-${CURRENT}|devo-bin-${VERSION}|g" /tmp/PKGBUILD.new
          sed -i "s/^sha256sums_x86_64=('.*')/sha256sums_x86_64=('${SHA_X86}')/" /tmp/PKGBUILD.new
          sed -i "s/^sha256sums_aarch64=('.*')/sha256sums_aarch64=('${SHA_AARCH64}')/" /tmp/PKGBUILD.new

          # Generate updated .SRCINFO
          cp .SRCINFO /tmp/.SRCINFO.new
          sed -i "s/${CURRENT}/${VERSION}/g" /tmp/.SRCINFO.new
          sed -i "s/^\([[:space:]]*sha256sums_x86_64 = \).*/\1${SHA_X86}/" /tmp/.SRCINFO.new
          sed -i "s/^\([[:space:]]*sha256sums_aarch64 = \).*/\1${SHA_AARCH64}/" /tmp/.SRCINFO.new

          # Cleanup downloads
          rm -f /tmp/devo-x86_64.tar.gz /tmp/devo-aarch64.tar.gz

      - name: Setup SSH for AUR
        if: steps.check.outputs.update == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Push update to AUR
        if: steps.check.outputs.update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"

          # Add AUR host key
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          git config user.name "ch4xer"
          git config user.email "ch4ser@users.noreply.github.com"

          # Build a clean commit for AUR (no subdirectories allowed)
          # Start from the aur branch which has no .github/
          git checkout aur

          # Apply updated files
          cp /tmp/PKGBUILD.new PKGBUILD
          cp /tmp/.SRCINFO.new .SRCINFO

          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}" || echo "No changes to commit"

          # Push aur branch -> AUR master
          git remote add aur ssh://aur@aur.archlinux.org/devo-bin.git 2>/dev/null || true
          git push aur aur:master

      - name: Sync update to GitHub master
        if: steps.check.outputs.update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"

          # Switch back to master and apply the same updates
          git checkout master

          cp /tmp/PKGBUILD.new PKGBUILD
          cp /tmp/.SRCINFO.new .SRCINFO

          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}" || echo "No changes to commit"

          git push origin master
